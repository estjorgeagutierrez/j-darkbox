<!DOCTYPE html>
<html lang="es">
<head>
    <title>DARKBOX — Panel Admin</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&family=Rajdhani:wght@500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin:0; padding:0; }
        body { background:#0a0f1e; color:white; font-family:"Inter",sans-serif; min-height:100vh; }

        /* LOGIN */
        .admin-login { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
        .login-card { width:100%; max-width:400px; background:#151d2e; border:1px solid rgba(168,85,247,0.3); border-radius:16px; padding:40px 32px; }
        .admin-logo { font-weight:900; font-size:1.8rem; text-align:center; margin-bottom:6px; background:linear-gradient(135deg,#C27AFF,#E60076); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .admin-sub { text-align:center; color:#8888aa; font-size:0.9rem; margin-bottom:28px; }
        .campo { display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
        .campo label { font-weight:600; font-size:0.82rem; color:#aaaacc; text-transform:uppercase; letter-spacing:0.04em; }
        .campo input, .campo textarea, .campo select {
            padding:11px 13px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1);
            border-radius:8px; color:white; font-family:"Inter",sans-serif; font-size:0.9rem; outline:none;
            width:100%; transition:border-color 0.2s; resize:vertical;
        }
        .campo input:focus, .campo textarea:focus, .campo select:focus { border-color:#a855f7; }
        .campo input::placeholder, .campo textarea::placeholder { color:#555577; }
        .campo select option { background:#151d2e; }
        .btn-primario { width:100%; background:linear-gradient(90deg,#7c3aed,#E60076); border:none; color:white; font-family:"Inter",sans-serif; font-weight:700; font-size:1rem; padding:13px; border-radius:8px; cursor:pointer; transition:opacity 0.2s,transform 0.15s; }
        .btn-primario:hover { opacity:0.85; transform:translateY(-1px); }
        .error-login { display:none; color:#f87171; font-size:0.88rem; font-weight:600; padding:10px 14px; background:rgba(248,113,113,0.1); border:1px solid rgba(248,113,113,0.3); border-radius:8px; margin-bottom:16px; }

        /* PANEL */
        #panel-admin { display:none; }
        .admin-header { background:linear-gradient(90deg,#101828,#59168B,#101828); border-bottom:1px solid rgba(168,85,247,0.4); padding:0 32px; height:70px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:99; }
        .admin-header-logo { font-weight:900; font-size:1.4rem; background:linear-gradient(135deg,#C27AFF,#E60076); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .admin-header-badge { background:rgba(168,85,247,0.2); border:1px solid rgba(168,85,247,0.4); color:#c084fc; padding:6px 14px; border-radius:20px; font-size:0.85rem; font-weight:600; }
        .btn-salir-admin { background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.12); color:#aaaacc; padding:8px 16px; border-radius:8px; cursor:pointer; font-family:"Inter",sans-serif; font-size:0.9rem; transition:background 0.2s; }
        .btn-salir-admin:hover { background:rgba(255,255,255,0.12); color:white; }

        .admin-body { max-width:1100px; margin:0 auto; padding:36px 24px 80px; }
        .admin-grid { display:grid; grid-template-columns:1fr 400px; gap:28px; align-items:start; }
        .seccion-titulo { font-weight:900; font-size:1.2rem; color:white; margin-bottom:18px; }

        /* LISTA */
        .juego-admin-item { display:flex; align-items:center; gap:14px; background:#151d2e; border:1px solid rgba(255,255,255,0.07); border-radius:10px; padding:14px 16px; margin-bottom:10px; transition:border-color 0.2s; animation:fadeIn 0.2s ease; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }
        .juego-admin-item:hover { border-color:rgba(168,85,247,0.3); }
        .juego-admin-img { width:88px; aspect-ratio:16/9; object-fit:cover; border-radius:6px; flex-shrink:0; background:#0a0f1e; }
        .juego-admin-info { flex:1; }
        .juego-admin-nombre { font-weight:700; font-size:0.92rem; color:white; margin-bottom:3px; }
        .juego-admin-genero { font-size:0.8rem; color:#8888aa; margin-bottom:3px; }
        .juego-admin-precio { font-weight:700; font-size:0.88rem; color:#22c55e; margin-bottom:3px; }
        .juego-admin-id { font-size:0.72rem; color:#444466; font-family:monospace; }
        .btn-eliminar-admin { background:transparent; border:1px solid rgba(248,113,113,0.3); color:#f87171; padding:7px 12px; border-radius:8px; cursor:pointer; font-family:"Inter",sans-serif; font-size:0.82rem; font-weight:600; flex-shrink:0; transition:background 0.2s; white-space:nowrap; }
        .btn-eliminar-admin:hover { background:rgba(248,113,113,0.12); }
        .admin-estado { background:#151d2e; border:1px solid rgba(255,255,255,0.07); border-radius:10px; padding:40px; text-align:center; color:#8888aa; font-size:0.95rem; }

        /* FORMULARIO */
        .form-card { background:#151d2e; border:1px solid rgba(168,85,247,0.2); border-radius:12px; padding:24px; position:sticky; top:90px; max-height:calc(100vh - 110px); overflow-y:auto; }
        .form-separador { font-size:0.75rem; font-weight:600; color:#555577; text-transform:uppercase; letter-spacing:0.06em; margin:18px 0 12px; padding-bottom:8px; border-bottom:1px solid rgba(255,255,255,0.06); }
        .campo-fila { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        .msg-form { font-size:0.85rem; font-weight:600; padding:10px 12px; border-radius:8px; margin-bottom:14px; display:none; }
        .msg-ok    { color:#4ade80; background:rgba(34,197,94,0.1); border:1px solid rgba(34,197,94,0.3); }
        .msg-error { color:#f87171; background:rgba(248,113,113,0.1); border:1px solid rgba(248,113,113,0.3); }

        @media(max-width:860px){ .admin-grid{grid-template-columns:1fr;} .form-card{position:static;max-height:none;} }
    </style>
</head>
<body>

<!-- LOGIN -->
<div class="admin-login" id="pantalla-login">
    <div class="login-card">
        <h1 class="admin-logo">DARKBOX</h1>
        <p class="admin-sub">Panel de Administración</p>
        <div class="error-login" id="error-login"></div>
        <div class="campo">
            <label>Clave de acceso</label>
            <input type="password" id="admin-key" placeholder="••••••••••••" onkeydown="if(event.key==='Enter')entrarAdmin()">
        </div>
        <button class="btn-primario" onclick="entrarAdmin()">Entrar al panel</button>
    </div>
</div>

<!-- PANEL -->
<div id="panel-admin">
    <div class="admin-header">
        <span class="admin-header-logo">DARKBOX</span>
        <span class="admin-header-badge">🛡️ Administrador</span>
        <button class="btn-salir-admin" onclick="salirAdmin()">↪ Salir</button>
    </div>

    <div class="admin-body">
        <div class="admin-grid">

            <!-- Lista de juegos -->
            <div>
                <h2 class="seccion-titulo">Juegos en el catálogo <span id="contador-juegos" style="font-size:0.9rem;color:#8888aa;font-weight:400;"></span></h2>
                <div id="lista-juegos-admin"><div class="admin-estado">Cargando...</div></div>
            </div>

            <!-- Formulario -->
            <div class="form-card">
                <h2 class="seccion-titulo">Agregar juego</h2>
                <div class="msg-form" id="msg-form"></div>

                <p class="form-separador">Información básica *</p>
                <div class="campo"><label>ID único *</label><input type="text" id="f-id" placeholder="ej: dying-light-2"></div>
                <div class="campo"><label>Nombre *</label><input type="text" id="f-nombre" placeholder="ej: Dying Light 2"></div>
                <div class="campo"><label>Género</label><input type="text" id="f-genero" placeholder="ej: Acción/Aventura"></div>
                <div class="campo"><label>Precio (COP) *</label><input type="number" id="f-precio" placeholder="ej: 149000"></div>
                <div class="campo"><label>URL imagen portada *</label><input type="text" id="f-imagen" placeholder="https://... (imagen principal)"></div>
                <div class="campo">
                    <label>Imágenes galería (separadas por coma)</label>
                    <textarea id="f-imagenes" rows="3" placeholder="URL1, URL2, URL3, URL4&#10;Ejemplo:&#10;https://imagen1.jpg, https://imagen2.jpg"></textarea>
                    <small style="color:#555577;font-size:0.78rem;margin-top:4px;">Hasta 4 URLs separadas por coma. Si vacío, se usa solo la portada.</small>
                </div>
                <div class="campo"><label>Descripción</label><textarea id="f-descripcion" rows="3" placeholder="Descripción del juego..."></textarea></div>

                <p class="form-separador">Detalles adicionales</p>
                <div class="campo-fila">
                    <div class="campo"><label>Desarrollador</label><input type="text" id="f-desarrollador" placeholder="ej: Arrowhead"></div>
                    <div class="campo"><label>Publicador</label><input type="text" id="f-publicador" placeholder="ej: Sony"></div>
                </div>
                <div class="campo-fila">
                    <div class="campo"><label>Lanzamiento</label><input type="text" id="f-fecha" placeholder="ej: 8 Feb 2024"></div>
                    <div class="campo"><label>Idiomas</label><input type="text" id="f-idiomas" placeholder="ej: Español, Inglés"></div>
                </div>
                <div class="campo"><label>Plataformas</label><input type="text" id="f-plataformas" placeholder="ej: PC, PS5"></div>

                <p class="form-separador">Requisitos mínimos</p>
                <div class="campo"><label>SO mínimo</label><input type="text" id="f-req-min-os" placeholder="ej: Windows 10 64-bit"></div>
                <div class="campo-fila">
                    <div class="campo"><label>CPU mínimo</label><input type="text" id="f-req-min-cpu" placeholder="ej: Intel Core i7-4790K"></div>
                    <div class="campo"><label>RAM mínima</label><input type="text" id="f-req-min-ram" placeholder="ej: 8 GB"></div>
                </div>
                <div class="campo-fila">
                    <div class="campo"><label>GPU mínima</label><input type="text" id="f-req-min-gpu" placeholder="ej: GTX 1050 Ti"></div>
                    <div class="campo"><label>Disco mínimo</label><input type="text" id="f-req-min-disco" placeholder="ej: 100 GB"></div>
                </div>

                <p class="form-separador">Requisitos recomendados</p>
                <div class="campo"><label>SO recomendado</label><input type="text" id="f-req-rec-os" placeholder="ej: Windows 11 64-bit"></div>
                <div class="campo-fila">
                    <div class="campo"><label>CPU recomendado</label><input type="text" id="f-req-rec-cpu" placeholder="ej: Intel Core i9-9900K"></div>
                    <div class="campo"><label>RAM recomendada</label><input type="text" id="f-req-rec-ram" placeholder="ej: 16 GB"></div>
                </div>
                <div class="campo-fila">
                    <div class="campo"><label>GPU recomendada</label><input type="text" id="f-req-rec-gpu" placeholder="ej: RTX 3080"></div>
                    <div class="campo"><label>Disco recomendado</label><input type="text" id="f-req-rec-disco" placeholder="ej: 100 GB SSD"></div>
                </div>

                <br>
                <button class="btn-primario" id="btn-form-submit" onclick="agregarJuego()">+ Agregar juego al catálogo</button>
                <button id="btn-cancelar-edicion" onclick="cancelarEdicion()" style="display:none;width:100%;margin-top:8px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);color:#aaaacc;font-family:Inter,sans-serif;font-weight:600;font-size:0.95rem;padding:11px;border-radius:8px;cursor:pointer;">✕ Cancelar edición</button>
            </div>

        </div>
    </div>
</div>

<script>
    var API_URL   = 'https://j-back-darkbox.onrender.com';
    var ADMIN_KEY = '';

    function v(id) { return document.getElementById(id).value.trim(); }

    /* ── LOGIN ── */
    function entrarAdmin() {
        var clave = v('admin-key');
        if (!clave) return;
        ADMIN_KEY = clave;
        cargarJuegos(function(ok) {
            if (ok) {
                document.getElementById('pantalla-login').style.display = 'none';
                document.getElementById('panel-admin').style.display    = 'block';
                sessionStorage.setItem('darkbox_admin_key', clave);
            } else {
                var err = document.getElementById('error-login');
                err.style.display = 'block';
                err.textContent   = 'Clave incorrecta o servidor no disponible.';
                ADMIN_KEY = '';
            }
        });
    }

    function salirAdmin() {
        sessionStorage.removeItem('darkbox_admin_key');
        ADMIN_KEY = '';
        document.getElementById('pantalla-login').style.display = 'flex';
        document.getElementById('panel-admin').style.display    = 'none';
        document.getElementById('admin-key').value = '';
    }

    /* ── CARGAR JUEGOS ── */
    function cargarJuegos(callback) {
        fetch(API_URL + '/api/juegos', { headers:{ 'x-admin-key': ADMIN_KEY } })
        .then(function(r){ return r.json(); })
        .then(function(data){
            if (data.ok) {
                renderizarListaAdmin(data.datos);
                if (callback) callback(true);
            } else {
                if (callback) callback(false);
            }
        })
        .catch(function(){ if (callback) callback(false); });
    }

    /* ── RENDERIZAR LISTA ── */
    function renderizarListaAdmin(juegos) {
        var zona = document.getElementById('lista-juegos-admin');
        var cont = document.getElementById('contador-juegos');
        cont.textContent = '(' + juegos.length + ' juego' + (juegos.length!==1?'s':'') + ')';

        if (!juegos || juegos.length === 0) {
            zona.innerHTML = '<div class="admin-estado">No hay juegos en el catálogo todavía.</div>';
            return;
        }

        zona.innerHTML = juegos.map(function(j) {
            var precio = j.precio === 0 ? 'GRATIS' : '$' + Number(j.precio).toLocaleString('es-CO');
            return [
                '<div class="juego-admin-item" id="admin-item-' + j.id + '">',
                '  <img src="' + (j.imagen||'') + '" class="juego-admin-img" alt="' + j.nombre + '" onerror="this.style.background=\'#1a2540\'">',
                '  <div class="juego-admin-info">',
                '    <div class="juego-admin-nombre">' + j.nombre + '</div>',
                '    <div class="juego-admin-genero">' + (j.genero||'Sin género') + '</div>',
                '    <div class="juego-admin-precio">' + precio + '</div>',
                '    <div class="juego-admin-id">ID: ' + j.id + '</div>',
                '  </div>',
                '  <div style="display:flex;gap:6px;flex-shrink:0;">',
                '    <button class="btn-eliminar-admin" style="border-color:rgba(168,85,247,0.35);color:#c084fc;background:rgba(168,85,247,0.08);" onclick="editarJuego(\'' + j.id + '\')">✏ Editar</button>',
                '    <button class="btn-eliminar-admin" onclick="eliminarJuego(\'' + j.id + '\',\'' + j.nombre.replace(/'/g,'') + '\')">🗑 Eliminar</button>',
                '  </div>',
                '</div>'
            ].join('');
        }).join('');
    }

    /* ── AGREGAR JUEGO ── */
    async function agregarJuego() {
        var id     = v('f-id').toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'');
        var nombre = v('f-nombre');
        var precio = v('f-precio');

        if (!id || !nombre || !precio) {
            mostrarMsg('error', 'Los campos ID, nombre y precio son obligatorios.');
            return;
        }

        var payload = {
            id, nombre,
            genero:       v('f-genero'),
            precio:       Number(precio),
            imagen:       v('f-imagen'),
            imagenes:     v('f-imagenes'),
            descripcion:  v('f-descripcion'),
            desarrollador:v('f-desarrollador'),
            publicador:   v('f-publicador'),
            fecha_lanzamiento: v('f-fecha'),
            idiomas:      v('f-idiomas'),
            plataformas:  v('f-plataformas'),
            req_min_os:   v('f-req-min-os'),
            req_min_cpu:  v('f-req-min-cpu'),
            req_min_ram:  v('f-req-min-ram'),
            req_min_gpu:  v('f-req-min-gpu'),
            req_min_disco:v('f-req-min-disco'),
            req_rec_os:   v('f-req-rec-os'),
            req_rec_cpu:  v('f-req-rec-cpu'),
            req_rec_ram:  v('f-req-rec-ram'),
            req_rec_gpu:  v('f-req-rec-gpu'),
            req_rec_disco:v('f-req-rec-disco')
        };

        var url    = modoEdicion ? API_URL + '/api/juegos/' + modoEdicion : API_URL + '/api/juegos';
        var metodo = modoEdicion ? 'PUT' : 'POST';
        var res  = await fetch(url, {
            method: metodo,
            headers: { 'Content-Type':'application/json', 'x-admin-key': ADMIN_KEY },
            body: JSON.stringify(payload)
        });
        var data = await res.json();

        if (data.ok) {
            var accion = modoEdicion ? 'actualizado' : 'agregado';
            mostrarMsg('ok', '✓ "' + nombre + '" ' + accion + ' correctamente.');
            cancelarEdicion();
            cargarJuegos();
        } else {
            mostrarMsg('error', data.error || 'Error al agregar el juego.');
        }
    }

    /* ── MODO EDICIÓN ── */
    var modoEdicion = null;

    function editarJuego(id) {
        fetch(API_URL + '/api/juegos/' + id)
        .then(function(r){ return r.json(); })
        .then(function(data){
            if (!data.ok) return;
            var j = data.datos;
            modoEdicion = id;
            var campos = {
                'f-id': j.id, 'f-nombre': j.nombre, 'f-genero': j.genero,
                'f-precio': j.precio, 'f-imagen': j.imagen, 'f-imagenes': j.imagenes,
                'f-descripcion': j.descripcion, 'f-desarrollador': j.desarrollador,
                'f-publicador': j.publicador, 'f-fecha': j.fecha_lanzamiento,
                'f-idiomas': j.idiomas, 'f-plataformas': j.plataformas,
                'f-req-min-os': j.req_min_os, 'f-req-min-cpu': j.req_min_cpu,
                'f-req-min-ram': j.req_min_ram, 'f-req-min-gpu': j.req_min_gpu,
                'f-req-min-disco': j.req_min_disco, 'f-req-rec-os': j.req_rec_os,
                'f-req-rec-cpu': j.req_rec_cpu, 'f-req-rec-ram': j.req_rec_ram,
                'f-req-rec-gpu': j.req_rec_gpu, 'f-req-rec-disco': j.req_rec_disco
            };
            Object.keys(campos).forEach(function(key) {
                var el = document.getElementById(key);
                if (el) el.value = campos[key] || '';
            });
            document.getElementById('f-id').disabled = true;
            document.getElementById('btn-form-submit').textContent = '💾 Guardar cambios';
            document.getElementById('btn-cancelar-edicion').style.display = 'block';
            document.querySelector('.form-card .seccion-titulo').textContent = 'Editando: ' + j.nombre;
            document.querySelector('.form-card').scrollIntoView({ behavior:'smooth' });
        });
    }

    function cancelarEdicion() {
        modoEdicion = null;
        document.getElementById('f-id').disabled = false;
        document.querySelectorAll('.form-card input, .form-card textarea').forEach(function(el){ el.value=''; });
        document.getElementById('btn-form-submit').textContent = '+ Agregar juego al catálogo';
        document.getElementById('btn-cancelar-edicion').style.display = 'none';
        document.querySelector('.form-card .seccion-titulo').textContent = 'Agregar juego';
    }

    /* ── ELIMINAR JUEGO ── */
    async function eliminarJuego(id, nombre) {
        if (!confirm('¿Eliminar "' + nombre + '" del catálogo?')) return;
        var res  = await fetch(API_URL + '/api/juegos/' + id, { method:'DELETE', headers:{'x-admin-key':ADMIN_KEY} });
        var data = await res.json();
        if (data.ok) {
            var item = document.getElementById('admin-item-' + id);
            if (item) { item.style.opacity='0.3'; item.style.pointerEvents='none'; }
            setTimeout(cargarJuegos, 500);
        } else {
            alert('Error: ' + (data.error||'No se pudo eliminar.'));
        }
    }

    function mostrarMsg(tipo, texto) {
        var el = document.getElementById('msg-form');
        el.className = 'msg-form msg-' + tipo;
        el.textContent = texto;
        el.style.display = 'block';
        setTimeout(function(){ el.style.display='none'; }, 4000);
    }

    /* Restaurar sesión al recargar */
    window.addEventListener('load', function() {
        var clave = sessionStorage.getItem('darkbox_admin_key');
        if (clave) {
            ADMIN_KEY = clave;
            cargarJuegos(function(ok) {
                if (ok) {
                    document.getElementById('pantalla-login').style.display = 'none';
                    document.getElementById('panel-admin').style.display    = 'block';
                } else {
                    sessionStorage.removeItem('darkbox_admin_key');
                    ADMIN_KEY = '';
                }
            });
        }
    });
</script>
</body>
</html>
