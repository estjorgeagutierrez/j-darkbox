var todosLosJuegos = [];
var filtroActual   = 'todos';

function formatearPrecio(n) {
    if (n === 0) return 'GRATIS';
    return '$' + Number(n).toLocaleString('es-CO');
}

/* ── CONSTRUIR LISTA COMBINADA ────────────────────────────────────
   Primero van los juegos de la BD (nuevos), luego los estáticos.
   Si un juego de la BD tiene el mismo id que uno estático, el estático
   mantiene su href a la página dedicada. */
function combinarJuegos(juegosBD) {
    var idsEstaticos = JUEGOS_ESTATICOS.map(function(j){ return j.id; });
    var nuevos = juegosBD.filter(function(j){ return !idsEstaticos.includes(j.id); });
    // Los nuevos van al frente con href dinámico
    var nuevosConHref = nuevos.map(function(j){
        return Object.assign({}, j, { href: 'juego-dinamico.html?id=' + j.id, esNuevo: true });
    });
    return nuevosConHref.concat(JUEGOS_ESTATICOS);
}

/* ── RENDERIZAR ── */
function renderizarJuegos(juegos) {
    var zona = document.getElementById('catalogo-lista');
    var sub  = document.getElementById('catalogo-subtitulo');

    if (!juegos || juegos.length === 0) {
        zona.innerHTML = '<div class="catalogo-estado"><p>No hay juegos para mostrar.</p></div>';
        sub.textContent = '0 juegos';
        return;
    }

    sub.textContent = juegos.length + ' juego' + (juegos.length !== 1 ? 's' : '') + ' disponible' + (juegos.length !== 1 ? 's' : '');

    zona.innerHTML = juegos.map(function(j) {
        var precioStr = formatearPrecio(j.precio);
        var badgeNuevo = j.esNuevo ? '<span class="catalogo-badge">✨ Nuevo</span>' : '';
        return [
            '<div class="catalogo-item" style="cursor:default">',
            '  <img src="' + (j.imagen||'') + '" alt="' + j.nombre + '" class="catalogo-img" onerror="this.style.background=\'#1a2540\'">',
            '  <div class="catalogo-info">',
            '    <p class="catalogo-nombre">' + j.nombre + badgeNuevo + '</p>',
            '    <p class="catalogo-genero">' + (j.genero||'') + '</p>',
            '    <p class="catalogo-precio">' + precioStr + '</p>',
            '  </div>',
            '  <div style="display:flex;gap:8px;align-items:center;flex-shrink:0;">',
            '    <button class="btn-catalogo-agregar" id="btn-cat-' + j.id + '" onclick="agregarJuego(\'' + j.id + '\',event)">🛒 Agregar</button>',
            '    <a href="' + j.href + '" style="background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:white;font-family:Inter,sans-serif;font-size:0.85rem;font-weight:600;padding:9px 14px;border-radius:8px;text-decoration:none;white-space:nowrap;transition:background 0.2s;" onmouseover="this.style.background=\'rgba(255,255,255,0.14)\'" onmouseout="this.style.background=\'rgba(255,255,255,0.08)\'">Ver detalles</a>',
            '  </div>',
            '</div>'
        ].join('\n');
    }).join('\n');
}

/* ── FILTROS ── */
function construirFiltros(juegos) {
    var generos = ['todos'];
    juegos.forEach(function(j){
        var g = (j.genero || '').split('/')[0].trim();
        if (g && !generos.includes(g)) generos.push(g);
    });
    var zona = document.getElementById('filtros-zona');
    zona.innerHTML = generos.slice(0,8).map(function(g){
        return '<button class="filtro-btn' + (g==='todos'?' activo':'') + '" onclick="aplicarFiltro(\'' + g + '\',this)">' + (g==='todos'?'Todos':g) + '</button>';
    }).join('');
}

function aplicarFiltro(genero, btn) {
    filtroActual = genero;
    document.querySelectorAll('.filtro-btn').forEach(function(b){ b.classList.remove('activo'); });
    btn.classList.add('activo');
    var filtrados = genero === 'todos' ? todosLosJuegos : todosLosJuegos.filter(function(j){
        return (j.genero||'').toLowerCase().includes(genero.toLowerCase());
    });
    renderizarJuegos(filtrados);
    marcarEstados();
}

/* ── AGREGAR AL CARRITO ── */
async function agregarJuego(juegoId, event) {
    event.preventDefault();
    event.stopPropagation();
    var juego = todosLosJuegos.find(function(j){ return j.id === juegoId; });
    if (!juego) return;
    var btn = document.getElementById('btn-cat-' + juegoId);
    if (btn) {
        if (btn.disabled) return;   /* evitar doble clic */
        btn.disabled=true; btn.textContent='Agregando...';
    }
    var ok = await Carrito.agregar({ id:juego.id, nombre:juego.nombre, genero:juego.genero||'', precio:juego.precio, imagen:juego.imagen||'' });
    if (ok) {
        Carrito.notificar('✓ ' + juego.nombre + ' agregado al carrito', 'ok');
        if (btn) { btn.textContent='✓ En carrito'; }
    } else {
        Carrito.notificar(juego.nombre + ' ya está en tu carrito o biblioteca', 'aviso');
        if (btn) { btn.disabled=false; btn.textContent='🛒 Agregar'; }
    }
}

/* ── MARCAR ESTADOS (en carrito / adquirido) ── */
async function marcarEstados() {
    var enCarrito    = await db.carrito.obtener();
    var enBiblioteca = await db.biblioteca.obtener();
    var idsC = enCarrito.map(function(j){ return j.juego_id||j.id; });
    var idsB = enBiblioteca.map(function(j){ return j.juego_id||j.id; });
    todosLosJuegos.forEach(function(j){
        var btn = document.getElementById('btn-cat-' + j.id);
        if (!btn) return;
        if (idsB.includes(j.id)) { btn.disabled=true; btn.textContent='✓ Ya adquirido'; }
        else if (idsC.includes(j.id)) { btn.disabled=true; btn.textContent='✓ En carrito'; }
    });
}

/* ── BUSCADOR ── */
document.getElementById('buscador-input').addEventListener('input', function() {
    var q = this.value.trim().toLowerCase();
    var base = filtroActual === 'todos' ? todosLosJuegos : todosLosJuegos.filter(function(j){ return (j.genero||'').toLowerCase().includes(filtroActual.toLowerCase()); });
    if (!q) { renderizarJuegos(base); marcarEstados(); return; }
    var filtrados = base.filter(function(j){ return j.nombre.toLowerCase().includes(q) || (j.genero||'').toLowerCase().includes(q); });
    renderizarJuegos(filtrados);
    marcarEstados();
});

async function cerrarSesion(event) {
    event.preventDefault();
    await db.auth.logout();
    window.location.href = 'home.html';
}

/* ── INICIALIZAR ── */
document.addEventListener('db-listo', async function() {
    var haySesion = await db.auth.haySesion();
    if (!haySesion) { window.location.href = 'login.html'; return; }

    var usuario = await db.auth.obtenerUsuario();
    if (usuario) {
        var nombre = usuario.nombre ? usuario.nombre : usuario.email.split('@')[0];
        document.querySelectorAll('.usuario-nombre').forEach(function(el){ el.textContent = '👤 ' + nombre; });
    }

    /* Cargar juegos nuevos de la BD y combinar con los estáticos */
    try {
        var API_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
            ? 'http://localhost:3000'
            : 'https://j-back-darkbox.onrender.com';
        var res  = await fetch(API_URL + '/api/juegos');
        var data = await res.json();
        todosLosJuegos = data.ok ? combinarJuegos(data.datos) : JUEGOS_ESTATICOS.slice();
    } catch(e) {
        todosLosJuegos = JUEGOS_ESTATICOS.slice();
    }

    construirFiltros(todosLosJuegos);
    renderizarJuegos(todosLosJuegos);
    await marcarEstados();
});
</script>
